<style>
/* Layout: one centred study column — header, set chips, a single card with its picture panel, then the grading bar */
:root{
  --bg:#e9eef1; --surface:#f8fafb; --ink:#10212f; --muted:#526472; --line:#cbd5dc;
  --accent:#c8331f; --accent-ink:#ffffff; --good:#1d7a4c; --chip:#dde5ea;
  --display:"Rubik","IBM Plex Sans Hebrew",system-ui,sans-serif;
  --body:"IBM Plex Sans Hebrew","Rubik",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c151d; --surface:#14212c; --ink:#e7eef3; --muted:#93a6b4; --line:#26384a;
  --accent:#ff6a4d; --accent-ink:#1a0c08; --good:#4fd194; --chip:#1c2c3a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c151d; --surface:#14212c; --ink:#e7eef3; --muted:#93a6b4; --line:#26384a;
  --accent:#ff6a4d; --accent-ink:#1a0c08; --good:#4fd194; --chip:#1c2c3a; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-family:var(--display);font-weight:700;font-size:1.6rem;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.9rem;margin:4px 0 0}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;color:var(--muted);font:600 .85rem var(--display);padding:6px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid transparent;background:var(--chip);color:var(--ink);font:500 .9rem var(--display);padding:7px 14px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chip .n{font-family:var(--mono);font-size:.75rem;opacity:.7;margin-inline-start:6px}
.stats{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stats .tools{display:flex;gap:6px}
.link{background:none;border:0;color:var(--ink);font:500 .85rem var(--display);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px 6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.viz-wrap{position:relative}
.viz{display:block;width:100%;height:auto;max-width:100%}
.cat{position:absolute;top:10px;inset-inline-start:12px;font:500 .7rem var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:rgba(0,0,0,.45);color:#fff}
.q{padding:14px 18px 0;font-family:var(--display);font-weight:600;font-size:1.05rem}
.body{padding:12px 18px 18px;display:flex;flex-direction:column;gap:12px}
.answer{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.answer .a{font-family:var(--display);font-weight:600;font-size:1.2rem;line-height:1.3;text-wrap:balance}
.answer .d{color:var(--muted);font-size:.95rem}
.answer .rule{font:500 .75rem var(--mono);color:var(--muted);letter-spacing:.04em}
.btn{border:0;border-radius:12px;font:600 1rem var(--display);padding:13px 16px;cursor:pointer}
.btn:focus-visible,.chip:focus-visible,.lang button:focus-visible,.link:focus-visible,.play:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.reveal{background:var(--ink);color:var(--bg);width:100%}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.again{background:var(--chip);color:var(--ink)}
.got{background:var(--good);color:var(--bg)}
.pattern{display:flex;flex-wrap:wrap;align-items:center;gap:8px;direction:ltr}
.blip{display:inline-block;background:var(--ink);border-radius:999px;height:12px}
.blip.s{width:12px}.blip.c{width:130px}.blip.f{width:14px;height:14px;background:#f3c64a;box-shadow:0 0 8px #f3c64a}.blip.l{width:46px}
.tag{font:500 .75rem var(--mono);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--ink)}
.play{position:absolute;inset:0;margin:auto;width:84px;height:84px;border-radius:50%;border:2px solid #f3c64a;background:rgba(243,198,74,.12);color:#f3c64a;font:600 .85rem var(--display);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px}
.play svg{width:26px;height:26px}
.mode{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--chip);border-radius:12px;padding:4px;gap:4px}
.mode button{border:0;border-radius:9px;background:transparent;color:var(--muted);font:600 .95rem var(--display);padding:9px;cursor:pointer}
.mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.qlabel{display:block;font:500 .8rem var(--body);color:var(--muted);margin-bottom:2px}
.opts{display:flex;flex-direction:column;gap:8px}
.opts.grid{display:grid;grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:10px;text-align:start;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px 12px;font:500 .95rem var(--body);cursor:pointer;min-width:0}
.opt.pic{flex-direction:column;align-items:stretch;padding:8px}
.opt .ok{font:500 .75rem var(--mono);color:var(--muted);flex:none}
.opt.pic .ok{align-self:flex-start}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt[disabled]{cursor:default;opacity:.55}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--bg));opacity:1}
.opt.wrong{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--bg));opacity:1}
.opt:focus-visible,.mode button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap.wide{max-width:1040px}
.learn{display:flex;flex-direction:column;gap:14px}
.learn h2{font:700 1.15rem var(--display);margin:10px 0 0}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.li{display:grid;grid-template-columns:116px minmax(0,1fr);gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px}
.li .viz{border-radius:8px}
.ltx{display:flex;flex-direction:column;gap:3px;min-width:0}
.ltx b{font:600 .95rem var(--display);line-height:1.3}
.lnum{font:500 .7rem var(--mono);color:var(--muted);letter-spacing:.03em}
.ld{font-size:.85rem;color:var(--muted);line-height:1.4}
.done{padding:28px 18px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.keys{font-size:.8rem;color:var(--muted);text-align:center}
.keys kbd{font:500 .75rem var(--mono);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:.08}}
@media (prefers-reduced-motion:reduce){.blink{animation-duration:2s}}
@media (max-width:420px){h1{font-size:1.35rem}.keys{display:none}}
</style>

function layout(v,view){
  const P=[];const has=v.ar||v.mine;
  if(view==='ahead'||view==='any'){
    const ax=v.mast||v.stack?96:100;
    if(v.mine){P.push(['G',100,22],['G',64,40],['G',136,40])}
    (v.ar||[]).forEach((c,i)=>P.push([c,ax,(v.ar.length>2?34:40)+i*16]));
    const mx=has&&!v.mine?116:100;
    if(v.mast===1)P.push(['W',mx,v.mine?56:has?22:40]);
    if(v.mast===2){if(has&&!v.mine)P.push(['W',114,60],['W',118,24]);else P.push(['W',98,58],['W',102,32])}
    if(v.stack)for(let i=0;i<v.stack;i++)P.push(['W',v.ar?116:98,62-i*14]);
    if(v.aftmast)P.push(['W',104,24]);
    if(v.flash)P.push([v.flash,100,18,1]);
    if(view==='ahead'&&v.sides)P.push(['G',84,92],['R',116,92]);
    if(v.single)P.push(['W',v.ar?134:100,72]);
  } else if(view==='astern'){
    if(v.mine){P.push(['G',100,22],['G',64,40],['G',136,40])}
    (v.ar||[]).forEach((c,i)=>P.push([c,100,30+i*16]));
    if(v.flash)P.push([v.flash,100,18,1]);
    if(v.tow)P.push(['Y',100,76]);
    if(v.stern)P.push(['W',100,90]);
  } else { // left = bow left (port side), right = bow right (starboard side)
    const L=view!=='right',bow=L?50:150,stn=L?150:50,d=L?-1:1,fwd=bow+d*-25,aft=stn+d*30;
    if(v.mine)P.push(['G',100,24],['G',100,40]);
    (v.ar||[]).forEach((c,i)=>P.push([c,100,(v.anchor?36:34)+i*16]));
    if(v.mast===1)P.push(['W',fwd,v.mine?40:48]);
    if(v.mast===2)P.push(['W',fwd,58],['W',aft,30]);
    if(v.stack)for(let i=0;i<v.stack;i++)P.push(['W',fwd,62-i*14]);
    if(v.aftmast)P.push(['W',aft,28]);
    if(v.flash)P.push([v.flash,100,18,1]);
    if(v.sides)P.push([L?'R':'G',bow-d*6,90]);
    if(v.single)P.push(['W',bow,70]);
    if(v.anchor===2)P.push(['W',L?28:172,56],['W',L?172:28,78]);
  }
  return P;
}
function describe(v,view){
  const en=[],he=[];
  if(v.mine){en.push('three all-round greens');he.push('שלושה ירוקים סביביים')}
  if(v.ar){en.push('all-round '+v.ar.map(c=>CN[c][0]).join(' over '));he.push(v.ar.map(c=>CN[c][1]).join(' מעל ')+' (סביביים)')}
  if(v.flash){en.push('flashing yellow');he.push('צהוב מהבהב')}
  if(view!=='astern'){
    if(v.mast===1){en.push('masthead light');he.push('אור תורן')}
    if(v.mast===2){en.push('two masthead lights, aft one higher');he.push('שני אורות תורן, האחורי גבוה יותר')}
    if(v.stack){en.push(NUM[v.stack][0]+' masthead lights in a vertical line');he.push(NUM[v.stack][1]+' אורות תורן בקו אנכי')}
    if(v.aftmast){en.push('aft masthead light');he.push('אור תורן אחורי')}
  }
  if(v.sides){if(view==='ahead'){en.push('both sidelights');he.push('שני אורות צד')}
    if(view==='left'){en.push('red sidelight');he.push('אור צד אדום')}
    if(view==='right'){en.push('green sidelight');he.push('אור צד ירוק')}}
  if(view==='astern'){if(v.tow){en.push('yellow towing light');he.push('אור גרירה צהוב')}if(v.stern){en.push('white sternlight');he.push('אור ירכתיים לבן')}}
  if(v.single){en.push(v.ar?'anchor light':'one white light');he.push(v.ar?'אור עוגן':'אור לבן אחד')}
  if(v.anchor===2){en.push('two anchor lights');he.push('שני אורות עוגן')}
  const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
  return [(en.length?cap(en.join(', '))+'. ':'')+v.nen,(he.length?he.join(', ')+'. ':'')+v.nhe];
}
// tow behind a tug seen from the side: squeeze the tug toward the bow and add the tow's sidelight
function withTow(P,view){
  const L=view==='left';
  const out=P.map(([c,x,y,b])=>[c,L?8+x*.5:92+x*.5,y,b]);
  out.push([L?'R':'G',L?178:22,92]);
  return out;
}

// ---------- drawing ----------
const LC={W:'#fff3d6',R:'#ff3d2e',G:'#27f08a',Y:'#ffcb2e'};
function lightsSVG(c){
  let g='';
  for(const [k,x,y,b] of c.lights){
    g+=`<g class="${b?'blink':''}"><circle cx="${x}" cy="${y}" r="10" fill="${LC[k]}" opacity=".28" filter="url(#glow)"/><circle cx="${x}" cy="${y}" r="3.4" fill="${LC[k]}"/></g>`;
  }
  return `<svg class="viz" viewBox="0 0 200 130" role="img" aria-label="Navigation lights at night">
  <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050b14"/><stop offset="1" stop-color="#0d1c2c"/></linearGradient>
  <filter id="glow" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="3"/></filter></defs>
  <rect width="200" height="130" fill="url(#sky)"/>
  <rect y="108" width="200" height="22" fill="#040910"/><line x1="0" y1="108" x2="200" y2="108" stroke="#1b3247" stroke-width=".6"/>
  <circle cx="22" cy="14" r=".6" fill="#8aa"/><circle cx="170" cy="20" r=".5" fill="#8aa"/><circle cx="140" cy="8" r=".6" fill="#8aa"/><circle cx="48" cy="30" r=".4" fill="#8aa"/>
  ${g}</svg>`;
}
function shape(t,x,y){
  const k='#151a1f';
  if(t==='ball')return `<circle cx="${x}" cy="${y}" r="10" fill="${k}"/>`;
  if(t==='dia')return `<polygon points="${x},${y-12} ${x+9},${y} ${x},${y+12} ${x-9},${y}" fill="${k}"/>`;
  if(t==='cyl')return `<rect x="${x-8}" y="${y-13}" width="16" height="26" fill="${k}"/>`;
  if(t==='coneUp')return `<polygon points="${x},${y-10} ${x+11},${y+10} ${x-11},${y+10}" fill="${k}"/>`;
  if(t==='coneDown')return `<polygon points="${x-11},${y-10} ${x+11},${y-10} ${x},${y+10}" fill="${k}"/>`;
  if(t==='flagA')return `<g transform="translate(${x} ${y-20}) scale(.5)">${flag('A')}</g>`;
  if(t==='sqflag')return `<rect x="${x}" y="${y-12}" width="26" height="24" fill="${k}"/>`;
  return '';
}
function shapesSVG(c){
  let s='';const xs=c.shapes.map(a=>a[1]);
  for(const [t,x,y] of c.shapes){ if(x!==100) s+=`<line x1="${x}" y1="20" x2="${x}" y2="${y}" stroke="#56636d" stroke-width=".7"/>`; s+=shape(t,x,y); }
  const yard=c.yard?`<line x1="${Math.min(...xs,70)}" y1="20" x2="${Math.max(...xs,130)}" y2="20" stroke="#56636d" stroke-width="2"/>`:'';
  return `<svg class="viz" viewBox="0 0 200 130" role="img" aria-label="Day shapes">
  <defs><linearGradient id="day" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bcd6e6"/><stop offset="1" stop-color="#e6f0f5"/></linearGradient></defs>
  <rect width="200" height="130" fill="url(#day)"/><rect y="112" width="200" height="18" fill="#7d9fb2"/>
  <line x1="100" y1="6" x2="100" y2="112" stroke="#56636d" stroke-width="2"/>${yard}${s}</svg>`;
}
const FR='#d2232a',FB='#1c4f9c',FY='#f6c21c',FK='#141414',FW='#ffffff';
function flag(k){
  const r=(x,y,w,h,c)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`;
  const p=(pts,c)=>`<polygon points="${pts}" fill="${c}"/>`;
  const swal='0,0 120,0 90,40 120,80 0,80';
  let b='';
  switch(k){
   case'A':b=`<clipPath id="sw"><polygon points="${swal}"/></clipPath><g clip-path="url(#sw)">${r(0,0,60,80,FW)}${r(60,0,60,80,FB)}</g><polygon points="${swal}" fill="none" stroke="#9aa5ad" stroke-width="1"/>`;return wrap(b,true);
   case'B':return wrap(p(swal,FR),true);
   case'C':b=r(0,0,120,16,FB)+r(0,16,120,16,FW)+r(0,32,120,16,FR)+r(0,48,120,16,FW)+r(0,64,120,16,FB);break;
   case'D':b=r(0,0,120,20,FY)+r(0,20,120,40,FB)+r(0,60,120,20,FY);break;
   case'E':b=r(0,0,120,40,FB)+r(0,40,120,40,FR);break;
   case'F':b=r(0,0,120,80,FW)+p('60,0 120,40 60,80 0,40',FR);break;
   case'G':for(let i=0;i<6;i++)b+=r(i*20,0,20,80,i%2?FB:FY);break;
   case'H':b=r(0,0,60,80,FW)+r(60,0,60,80,FR);break;
   case'I':b=r(0,0,120,80,FY)+`<circle cx="60" cy="40" r="20" fill="${FK}"/>`;break;
   case'J':b=r(0,0,120,27,FB)+r(0,27,120,26,FW)+r(0,53,120,27,FB);break;
   case'K':b=r(0,0,60,80,FY)+r(60,0,60,80,FB);break;
   case'L':b=r(0,0,60,40,FY)+r(60,0,60,40,FK)+r(0,40,60,40,FK)+r(60,40,60,40,FY);break;
   case'M':b=r(0,0,120,80,FB)+`<path d="M0 0L120 80M120 0L0 80" stroke="${FW}" stroke-width="16"/>`;break;
   case'N':for(let i=0;i<4;i++)for(let j=0;j<4;j++)b+=r(i*30,j*20,30,20,(i+j)%2?FW:FB);break;
   case'O':b=p('0,0 120,0 120,80',FR)+p('0,0 0,80 120,80',FY);break;
   case'P':b=r(0,0,120,80,FB)+r(40,27,40,26,FW);break;
   case'Q':b=r(0,0,120,80,FY);break;
   case'R':b=r(0,0,120,80,FR)+r(50,0,20,80,FY)+r(0,30,120,20,FY);break;
   case'S':b=r(0,0,120,80,FW)+r(40,27,40,26,FB);break;
   case'T':b=r(0,0,40,80,FR)+r(40,0,40,80,FW)+r(80,0,40,80,FB);break;
   case'U':b=r(0,0,60,40,FR)+r(60,0,60,40,FW)+r(0,40,60,40,FW)+r(60,40,60,40,FR);break;
   case'V':b=r(0,0,120,80,FW)+`<path d="M0 0L120 80M120 0L0 80" stroke="${FR}" stroke-width="16"/>`;break;
   case'W':b=r(0,0,120,80,FB)+r(20,13,80,54,FW)+r(40,27,40,26,FR);break;
   case'X':b=r(0,0,120,80,FW)+r(50,0,20,80,FB)+r(0,30,120,20,FB);break;
   case'Y':b=r(0,0,120,80,FY);for(let i=-6;i<12;i+=2)b+=p(`${i*16},80 ${i*16+16},80 ${i*16+96},0 ${i*16+80},0`,FR);b=`<clipPath id="yc"><rect width="120" height="80"/></clipPath><g clip-path="url(#yc)">${b}</g>`;break;
   case'Z':b=p('0,0 120,0 60,40',FY)+p('0,0 60,40 0,80',FK)+p('0,80 60,40 120,80',FR)+p('120,0 60,40 120,80',FB);break;
  }
  return wrap(b+`<rect width="120" height="80" fill="none" stroke="#9aa5ad" stroke-width="1"/>`);
  function wrap(inner){return inner}
}
function flagsSVG(c){
  const n=c.flags.length,h=n===1?130:200;
  let s=`<svg class="viz" viewBox="0 0 200 ${h}" role="img" aria-label="Code flag"><rect width="200" height="${h}" fill="#dfe8ee"/><line x1="34" y1="0" x2="34" y2="${h}" stroke="#7a8791" stroke-width="2"/>`;
  c.flags.forEach((k,i)=>{const y=n===1?25:12+i*96; s+=`<line x1="34" y1="${y}" x2="44" y2="${y}" stroke="#7a8791" stroke-width="1.5"/><g transform="translate(44 ${y})">${flag(k)}</g>`;});
  return s+'</svg>';
}
function soundSVG(seq){
  // draws the signal the way the syllabus shows it: dots for short blasts, dashes for long ones
  const toks=[...(seq||'')],W={s:10,l:30,C:140},GAP=12;
  const total=toks.reduce((n,t)=>n+(W[t]||0),0)+GAP*Math.max(0,toks.length-1);
  let x=100-total/2,g='';
  for(const t of toks){
    if(t==='s')g+=`<circle cx="${x+5}" cy="55" r="5" fill="#15191d"/>`;
    else if(t==='l'||t==='C')g+=`<rect x="${x}" y="51" width="${W[t]}" height="8" rx="4" fill="#15191d"/>`;
    x+=(W[t]||0)+GAP;
  }
  return `<svg class="viz" viewBox="0 0 200 110" role="img" aria-label="Sound signal"><rect width="200" height="110" fill="#c9ced3"/>${g}</svg>`;
}
function patternHTML(seq,lang){
  const lab={en:{B:'Bell 5 s',G:'Gong 5 s',k:'Bell stroke',C:'Continuous'},he:{B:'פעמון 5 ש\'',G:'גונג 5 ש\'',k:'מכת פעמון',C:'רציף'}}[lang];
  if(seq==='SOS')return '<span class="pattern"><span class="tag">··· — — — ···</span></span>';
  return '<span class="pattern">'+[...seq].map(t=>t==='f'?'<span class="blip f" title="flash"></span>':t==='s'?'<span class="blip s" title="short"></span>':t==='l'?'<span class="blip l" title="long"></span>':t==='C'?'<span class="blip c" title="continuous"></span>':`<span class="tag">${lab[t]}</span>`).join('')+'</span>';
}

// sounds are shown, not played
let playing=false;function stopSound(){}

// ---------- state ----------
const KEY='lights-signals-cards-v1';
let st={lang:'en',set:'all',known:[],mode:'cards'};
try{Object.assign(st,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
st.lang='en'; // Hebrew hidden for now
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({lang:st.lang,set:st.set,known:st.known,mode:st.mode}))}catch(e){}};
let pile=[],revealed=false,quiz={opts:[],picked:null,right:0,done:0};
const SETS=[['all',null],['lights','L'],['shapes','D'],['sounds','S'],['flags','F']];
const inSet=c=>{const m=SETS.find(s=>s[0]===st.set)[1];return !m||c.cat===m};
const quizable=c=>!(c.cat==='S'&&!c.seq);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function build(){
  stopSound();revealed=false;
  if(st.mode==='learn'){render();return}
  if(st.mode==='quiz'){pile=shuffle(ALL.filter(c=>inSet(c)&&quizable(c)));quiz={opts:[],picked:null,right:0,done:0};makeOpts()}
  else pile=shuffle(ALL.filter(c=>inSet(c)&&!st.known.includes(c.id)));
  render();
}
// what makes two answers "the same" for distractor picking
const vkey=c=>c.rev?(c.cat==='F'?c.flags.join(''):c.cat==='D'?JSON.stringify(c.shapes):c.seq):c.en;
function makeOpts(){
  const c=pile[0];quiz.picked=null;if(!c){quiz.opts=[];return}
  const pool=shuffle([...ALL,...DECOYS].filter(x=>x.cat===c.cat&&!!x.rev===!!c.rev&&quizable(x)&&vkey(x)!==vkey(c)));
  const seen=new Set([vkey(c)]),opts=[c];
  for(const x of pool){if(opts.length>=4)break;const k=vkey(x);if(!seen.has(k)){seen.add(k);opts.push(x)}}
  quiz.opts=shuffle(opts);
}

// ---------- render ----------
function renderChrome(){
  const t=T[st.lang];
  document.documentElement.lang=st.lang;document.documentElement.dir=st.lang==='he'?'rtl':'ltr';
  document.getElementById('t-title').textContent=t.title;document.getElementById('t-sub').textContent=t.sub;
  document.getElementById('lang-en').setAttribute('aria-pressed',st.lang==='en');document.getElementById('lang-he').setAttribute('aria-pressed',st.lang==='he');
  document.getElementById('mode-learn').textContent=t.modeLearn;document.getElementById('mode-learn').setAttribute('aria-pressed',st.mode==='learn');document.getElementById('mode-cards').textContent=t.modeCards;document.getElementById('mode-quiz').textContent=t.modeQuiz;
  document.getElementById('mode-cards').setAttribute('aria-pressed',st.mode==='cards');document.getElementById('mode-quiz').setAttribute('aria-pressed',st.mode==='quiz');
  document.getElementById('chips').innerHTML=SETS.map(([k,m])=>`<button class="chip" type="button" data-set="${k}" aria-pressed="${st.set===k}">${t[k]}<span class="n">${ALL.filter(c=>!m||c.cat===m).length}</span></button>`).join('');
  document.getElementById('shuffle').textContent=t.shuffle;document.getElementById('reset').textContent=t.reset;
  document.getElementById('shuffle').hidden=st.mode==='quiz';
  document.getElementById('keys').innerHTML=st.mode==='quiz'?t.qkeys:t.keys;
}
function question(c,t){
  if(c.rev)return `<span class="qlabel">${t.revQ[c.cat]}</span>${st.lang==='he'?c.he:c.en}`;
  if(c.cat==='L')return t.v[c.view];if(c.cat==='D')return t.shapeQ;if(c.cat==='S')return c.ctx==='light'?t.lightQ:t.sq[c.ctx];return t.flagQ;
}
function vizOf(c){return c.cat==='L'?lightsSVG(c):c.cat==='D'?shapesSVG(c):c.cat==='F'?flagsSVG(c):soundSVG(c.seq)}
function hidden(){return `<svg class="viz" viewBox="0 0 200 90" aria-hidden="true"><rect width="200" height="90" fill="#1a2a37"/><text x="100" y="60" text-anchor="middle" font-family="Rubik,sans-serif" font-size="44" font-weight="700" fill="#f3c64a" opacity=".85">?</text></svg>`}
function optVisual(x,lang){
  if(!x.rev)return `<span>${lang==='he'?x.he:x.en}</span>`;
  if(x.cat==='S')return patternHTML(x.seq,lang);
  return x.cat==='F'?flagsSVG(x):shapesSVG(x);
}
function render(){
  renderChrome();
  const learning=st.mode==='learn';
  document.querySelector('.wrap').classList.toggle('wide',learning);
  ['card','keys'].forEach(id=>document.getElementById(id).hidden=learning);
  document.querySelector('.stats').hidden=learning;
  document.getElementById('learn').hidden=!learning;
  if(learning){renderLearn();return}
  const t=T[st.lang],lang=st.lang,el=document.getElementById('card'),quizMode=st.mode==='quiz';
  const total=ALL.filter(c=>inSet(c)).length,known=ALL.filter(c=>inSet(c)&&st.known.includes(c.id)).length;
  document.getElementById('count').textContent=quizMode?`${pile.length} ${t.left} · ${quiz.right}/${quiz.done} ${t.correct}`:`${pile.length} ${t.left} · ${known}/${total} ${t.known}`;
  if(!pile.length){
    const msg=quizMode?`${t.score} ${quiz.right}/${quiz.done} (${quiz.done?Math.round(100*quiz.right/quiz.done):0}%)`:t.done;
    el.innerHTML=`<div class="done"><p style="font-family:var(--display);font-weight:600;font-size:1.15rem;margin:0">${msg}</p><button class="btn reveal" id="again-set" type="button" style="width:auto">${quizMode?t.newQuiz:t.studyAgain}</button></div>`;
    document.getElementById('again-set').onclick=quizMode?build:resetSet;return}
  const c=pile[0];
  const showViz=!c.rev||revealed||(quizMode&&quiz.picked!==null);
  const viz=c.rev&&!showViz?hidden():vizOf(c);
  const ansBlock=()=>c.rev
    ?`<div class="answer"><div class="a">${lang==='he'?c.dhe:c.den}</div><div class="rule">${c.rule}</div></div>`
    :`<div class="answer"><div class="a">${lang==='he'?c.he:c.en}</div><div class="d">${lang==='he'?c.dhe:c.den}</div><div class="rule">${c.rule}</div></div>`;
  let body;
  if(quizMode){
    const picked=quiz.picked!==null;
    const opts=quiz.opts.map((x,i)=>{let cls='opt'+(x.rev&&x.cat!=='S'?' pic':'');
      if(picked){if(x===c)cls+=' right';else if(i===quiz.picked)cls+=' wrong'}
      return `<button class="${cls}" type="button" data-i="${i}" ${picked?'disabled':''}><span class="ok">${i+1}</span>${optVisual(x,lang)}</button>`}).join('');
    body=`<div class="opts${c.rev&&c.cat!=='S'?' grid':''}">${opts}</div>${picked?ansBlock()+`<button class="btn reveal" id="b-next" type="button">${t.next}</button>`:''}`;
  } else body=revealed?ansBlock()+`<div class="grade"><button class="btn again" id="b-again" type="button">${t.again}</button><button class="btn got" id="b-got" type="button">${t.got}</button></div>`
    :`<button class="btn reveal" id="b-show" type="button">${t.show}</button>`;
  el.innerHTML=`<div class="viz-wrap">${viz}<span class="cat">${t.catNames[c.cat]}${c.num?' · '+c.num:''}${c.rev?' · '+t.rev:''}</span></div><div class="q">${question(c,t)}</div><div class="body">${body}</div>`;
  if(quizMode){el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.i));const n=document.getElementById('b-next');if(n){n.onclick=nextQ;n.focus()}}
  else if(revealed){document.getElementById('b-again').onclick=again;document.getElementById('b-got').onclick=got}
  else document.getElementById('b-show').onclick=show;
}
// Learn: every item in the chosen set, picture next to its meaning, in syllabus order
function renderLearn(){
  const t=T[st.lang],lang=st.lang;
  const html=['L','D','S','F'].map(cat=>{
    const items=ALL.filter(c=>c.cat===cat&&!c.rev&&inSet(c)).sort((a,b)=>(a.num||0)-(b.num||0));
    if(!items.length)return '';
    const rows=items.map(c=>`<article class="li">${vizOf(c)}<div class="ltx"><span class="lnum">${c.num?'#'+c.num+' · ':''}${c.rule}</span><b>${lang==='he'?c.he:c.en}</b><span class="ld">${lang==='he'?c.dhe:c.den}</span></div></article>`).join('');
    return `<h2>${t.learnHead[cat]} <span class="n" style="font:500 .8rem var(--mono);color:var(--muted)">${items.length}</span></h2><div class="lgrid">${rows}</div>`;
  }).join('');
  document.getElementById('learn').innerHTML=html;
}
function pick(i){if(quiz.picked!==null)return;quiz.picked=i;quiz.done++;if(quiz.opts[i]===pile[0])quiz.right++;stopSound();render()}
function nextQ(){pile.shift();stopSound();makeOpts();render()}
function show(){revealed=true;render();document.getElementById('b-got')?.focus()}
function next(){revealed=false;stopSound();render()}
function again(){const c=pile.shift();pile.splice(Math.min(3,pile.length),0,c);next()}
function got(){const c=pile.shift();if(!st.known.includes(c.id))st.known.push(c.id);save();next()}
function resetSet(){st.known=st.known.filter(id=>{const c=ALL.find(x=>x.id===id);return c&&!inSet(c)});save();build()}

document.getElementById('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;st.set=b.dataset.set;save();build()});
document.getElementById('lang-en').onclick=()=>{st.lang='en';save();render()};
document.getElementById('lang-he').onclick=()=>{st.lang='he';save();render()};
document.getElementById('mode-learn').onclick=()=>{st.mode='learn';save();render()};
document.getElementById('mode-cards').onclick=()=>{st.mode='cards';save();build()};
document.getElementById('mode-quiz').onclick=()=>{st.mode='quiz';save();build()};
document.getElementById('shuffle').onclick=()=>{shuffle(pile);revealed=false;stopSound();render()};
document.getElementById('reset').onclick=()=>st.mode==='quiz'?build():resetSet();
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea')||st.mode==='learn')return;
  const c=pile[0];if(!c)return;
  if(st.mode==='quiz'){
    if(quiz.picked===null&&/^[1-4]$/.test(e.key)&&+e.key<=quiz.opts.length)pick(+e.key-1);
    else if(quiz.picked!==null&&(e.key==='Enter'||e.key===' ')){e.preventDefault();nextQ()}
    return}
  if(e.key===' '&&!revealed){e.preventDefault();show()}
  else if(revealed&&e.key==='1')again();
  else if(revealed&&e.key==='2')got();
});
build();
</script>
